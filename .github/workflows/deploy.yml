name: build-test-deploy

on:
  push:
    branches: [main]
    paths: ['ai-service/**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: teachmewrite-prod
  REGION: asia-south1
  SERVICE: teachmewrite-ai
  IMAGE_REPO: asia-south1-docker.pkg.dev/teachmewrite-prod/teachmewrite-ai/teachmewrite-ai

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/195673983724/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deployer@teachmewrite-prod.iam.gserviceaccount.com"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and push image (tagged with commit SHA)
        run: |
          IMAGE="$IMAGE_REPO:$GITHUB_SHA"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" ai-service/
          docker push "$IMAGE"

      - name: Deploy to Cloud Run (no traffic, staging tag)
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-secrets ANTHROPIC_API_KEY=anthropic-api-key:latest \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 120 \
            --no-traffic \
            --tag staging \
            --project "$PROJECT_ID"
          STAGING_URL=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format='value(status.traffic[?(@.tag=="staging")].url)' | head -n1)
          echo "STAGING_URL=$STAGING_URL" >> "$GITHUB_ENV"

      - name: Wait for staging to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf "$STAGING_URL/health" > /dev/null; then
              echo "Staging ready at $STAGING_URL"; exit 0
            fi
            echo "waiting... ($i/30)"; sleep 3
          done
          echo "staging did not become healthy in 90s"; exit 1

      - name: Run golden-set gate (3 runs, 2-of-3 rule)
        run: |
          pip install -r ai-service/requirements-gate.txt
          python ai-service/run_gate.py "$STAGING_URL" --runs 3 --threshold 2 --out gate_result.json

      - name: Promote staging to 100% traffic (only if gate passed)
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --to-latest
          echo "Promoted $IMAGE to 100% traffic."

      - name: Upload gate result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-result-${{ github.sha }}
          path: gate_result.json
          if-no-files-found: ignore
