name: build-test-deploy

on:
  push:
    branches: [main]
    paths: ['ai-service/**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: teachmewrite-prod
  REGION: asia-south1
  SERVICE: teachmewrite-ai
  IMAGE_REPO: asia-south1-docker.pkg.dev/teachmewrite-prod/teachmewrite-ai/teachmewrite-ai

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/195673983724/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deployer@teachmewrite-prod.iam.gserviceaccount.com"
          token_format: 'access_token'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to Artifact Registry
        run: |
          echo "${{ steps.auth.outputs.access_token }}" | docker login \
            -u oauth2accesstoken --password-stdin \
            https://asia-south1-docker.pkg.dev

      - name: Build and push image (tagged with commit SHA)
        run: |
          IMAGE="$IMAGE_REPO:$GITHUB_SHA"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" ai-service/
          docker push "$IMAGE"

      - name: Deploy to Cloud Run (no traffic, staging tag)
        run: |
          # 1. Deploy and capture the base service URL directly from deploy output
          BASE_URL=$(gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-secrets ANTHROPIC_API_KEY=anthropic-api-key:latest \
            --set-env-vars "METRICS_USER=grafana,METRICS_PASS=TMw_metrics_2026,TMW_API_KEYS=dummy_key_for_ci_pipeline_32_chars_long" \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 120 \
            --no-traffic \
            --tag staging \
            --project "$PROJECT_ID" \
            --format="value(status.url)")

          # 2. Construct the tagged URL manually: https://staging---<base_url_domain>
          STAGING_URL=$(echo "$BASE_URL" | sed 's|https://|https://staging---|')
          
          echo "Constructed Staging URL: $STAGING_URL"
          echo "STAGING_URL=$STAGING_URL" >> "$GITHUB_ENV"

      - name: Wait for staging to be ready
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "ERROR: STAGING_URL is empty. Cannot proceed."
            exit 1
          fi

          for i in $(seq 1 50); do
            # -s silent, -o discard output, -w print HTTP code. || true prevents early exit.
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/health" || true)
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Staging ready at $STAGING_URL (HTTP 200)"
              exit 0
            fi
            
            echo "waiting... ($i/50) - Last HTTP status: $HTTP_STATUS"
            sleep 3
          done
          echo "ERROR: staging did not become healthy in 150s"
          exit 1

      - name: Run golden-set gate (3 runs, 2-of-3 rule, with LLM Judge)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -r ai-service/requirements-gate.txt
          python ai-service/run_gate.py "$STAGING_URL" --runs 3 --threshold 2 --judge --min-helpfulness 3 --out gate_result.json
      - name: Promote staging to 100% traffic (only if gate passed)
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --to-latest
          echo "Promoted $IMAGE to 100% traffic."

      - name: Upload gate result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-result-${{ github.sha }}
          path: gate_result.json
          if-no-files-found: ignore
