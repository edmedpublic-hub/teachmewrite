name: build-test-deploy

on:
  push:
    branches: [main]
    paths: ['ai-service/**']
  workflow_dispatch:  # allow manual trigger for the deliberate-break test

permissions:
  contents: read
  id-token: write   # REQUIRED for WIF: lets the workflow request a GitHub OIDC token

env:
  PROJECT_ID: teachmewrite-prod
  REGION: asia-south1
  SERVICE: teachmewrite-ai
  REPO: asia-south1-docker.pkg.dev/teachmewrite-prod/teachmewrite-ai/teachmewrite-ai

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/195673983724/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deployer@teachmewrite-prod.iam.gserviceaccount.com"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image (tagged with commit SHA)
        run: |
          IMAGE="${ env.REPO }:${ github.sha }"
          gcloud builds submit \
            --tag "$IMAGE" \
            --project "${ env.PROJECT_ID }" \
            ai-service/
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run (no traffic, staging tag)
        run: |
          gcloud run deploy "${ env.SERVICE }" \
            --image "${ env.IMAGE }" \
            --region "${ env.REGION }" \
            --platform managed \
            --allow-unauthenticated \
            --set-secrets ANTHROPIC_API_KEY=anthropic-api-key:latest \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 120 \
            --no-traffic \
            --tag staging \
            --project "${ env.PROJECT_ID }"
          # Capture the staging URL for the gate step
          STAGING_URL=$(gcloud run services describe "${ env.SERVICE }" \
            --region "${ env.REGION }" \
            --project "${ env.PROJECT_ID }" \
            --format='value(status.traffic[?(@.tag=="staging")].url)' | head -n1)
          echo "STAGING_URL=$STAGING_URL" >> "$GITHUB_ENV"

      - name: Wait for staging to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf "${ env.STAGING_URL }/health" > /dev/null; then
              echo "Staging ready at ${ env.STAGING_URL }"; exit 0
            fi
            echo "waiting... ($i/30)"; sleep 3
          done
          echo "staging did not become healthy in 90s"; exit 1

      - name: Run golden-set gate (3 runs, 2-of-3 rule)
        run: |
          pip install -r ai-service/requirements-gate.txt
          python ai-service/run_gate.py "${ env.STAGING_URL }" \
            --runs 3 --threshold 2 --out gate_result.json

      - name: Promote staging to 100% traffic (only if gate passed)
        run: |
          gcloud run services update-traffic "${ env.SERVICE }" \
            --region "${ env.REGION }" \
            --project "${ env.PROJECT_ID }" \
            --to-latest
          echo "Promoted ${ env.IMAGE } to 100% traffic."

      - name: Upload gate result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-result-${ github.sha }
          path: gate_result.json
          if-no-files-found: ignore
